<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blockbuster</title>
    <link rel="icon" type="image/png" href="assets/blockbuster.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas id="gameCanvas"></canvas>
    <div class="modal fade" id="newScoreModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content winner-modal">
          <div class="modal-body text-center p-4 p-sm-5">
            <div class="winner-confetti winner-confetti-a"></div>
            <div class="winner-confetti winner-confetti-b"></div>
            <div class="winner-confetti winner-confetti-c"></div>
            <div class="winner-badge">New Score</div>
            <div class="winner-score-wrap">
              <span class="winner-score-decoration">★</span>
              <div id="winnerScoreValue" class="winner-score-value">0</div>
              <span class="winner-score-decoration">★</span>
            </div>
            <div class="winner-ribbon">YOU WIN!</div>
            <div class="winner-spark winner-spark-a"></div>
            <div class="winner-spark winner-spark-b"></div>
            <div class="winner-spark winner-spark-c"></div>
            <form id="newScoreForm" class="winner-initials-form" autocomplete="off">
              <input id="scoreInitial1" class="winner-initial-input" type="text" maxlength="1" inputmode="text" />
              <input id="scoreInitial2" class="winner-initial-input" type="text" maxlength="1" inputmode="text" />
              <input id="scoreInitial3" class="winner-initial-input" type="text" maxlength="1" inputmode="text" />
              <button type="submit" class="btn btn-primary winner-save-btn">🏆 Save Score</button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
